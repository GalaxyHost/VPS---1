name: Test Web Server

on:
  workflow_dispatch:

jobs:
  webserver:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install Nginx
        run: |
          sudo apt update
          sudo apt install -y nginx

      - name: Create website
        run: |
          sudo tee /var/www/html/index.html > /dev/null <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>GalaxyHost</title>
          </head>
          <body>
              <h1>GalaxyHost Web Server</h1>
              <p>Server beží na GitHub Actions runneri.</p>
          </body>
          </html>
          EOF

      - name: Start Nginx
        run: |
          sudo systemctl restart nginx
          curl http://localhost

      - name: Server information
        run: |
          echo "Hostname: $(hostname)"
          echo "Public IP: $(curl -4 -s https://api.ipify.org)"

      - name: Keep server running
        run: |
          while true; do
            echo "Web server is running..."
            sleep 60
          done
